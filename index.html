<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenamiento Bandas Crivit</title>
  <style>
    :root {
      --bg: #121418;
      --card: #1c2027;
      --card-border: #2c3340;
      --text: #f0f3f6;
      --muted: #8b949e;
      --accent: #ff6a00;
      --accent-hover: #e05d00;
      --green: #2ea043;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 90px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.3rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); border-radius: 8px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .exercise-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .exercise-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .exercise-title { font-size: 1rem; font-weight: bold; }
    .exercise-target { font-size: 0.75rem; color: var(--muted); }
    .exercise-desc { font-size: 0.8rem; color: #b1bac4; margin-bottom: 12px; line-height: 1.3; }
    .config-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
    .config-item label { display: block; font-size: 0.65rem; color: var(--muted); margin-bottom: 2px; }
    .config-item input { width: 100%; background: #0f1115; border: 1px solid var(--card-border); color: #fff; border-radius: 6px; padding: 6px; font-size: 0.85rem; text-align: center; }
    .series-tracker { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .btn-action { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .btn-complete { background: var(--green); color: #fff; }
    .btn-reset { background: #30363d; color: var(--muted); }
    .sets-counter { font-size: 0.85rem; color: #fff; font-weight: 600; }
    /* Timer Dock */
    .timer-dock { position: fixed; bottom: 0; left: 0; right: 0; background: #161b22; border-top: 1px solid var(--card-border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .timer-info { display: flex; align-items: baseline; gap: 8px; }
    .timer-label { font-size: 0.75rem; color: var(--muted); }
    .timer-value { font-size: 1.4rem; font-weight: bold; font-family: monospace; color: var(--accent); }
    .timer-controls { display: flex; gap: 6px; }
    .btn-timer { background: #21262d; border: 1px solid var(--card-border); color: #fff; border-radius: 6px; padding: 6px 12px; font-size: 0.75rem; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Crivit Resistance Hub</h1>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchRoutine('push')">Día Empuje</button>
    <button class="tab-btn" onclick="switchRoutine('pull')">Día Tirón</button>
  </div>

  <main id="exercises-container"></main>

  <div class="timer-dock">
    <div class="timer-info">
      <span class="timer-label">Descanso:</span>
      <span class="timer-value" id="timer-display">00:00</span>
    </div>
    <div class="timer-controls">
      <button class="btn-timer" onclick="addSeconds(30)">+30s</button>
      <button class="btn-timer" onclick="stopTimer()">Reset</button>
    </div>
  </div>

  <script>
    const routines = {
      push: [
        { id: "p1", name: "Flexiones en silla", target: "Pecho y tríceps", desc: "Manos al ancho de hombros sobre la silla. Bajada controlada en 3s.", sets: 4, reps: "8-12", rest: 90, completedSets: 0 },
        { id: "p2", name: "Elevaciones laterales", target: "Deltoides lateral", desc: "Pisa la banda gris con 1 pie. Sube hasta altura de hombros sin balanceo.", sets: 3, reps: "12-15", rest: 60, completedSets: 0 },
        { id: "p3", name: "Fondos en silla", target: "Tríceps", desc: "Manos al borde, rodillas a 90° para asistir el peso corporal. Codos a 90°.", sets: 3, reps: "8-10", rest: 75, completedSets: 0 },
        { id: "p4", name: "Extensión tríceps sobre cabeza", target: "Tríceps", desc: "Pisa el extremo con el talón y empuja la banda larga hacia el techo.", sets: 3, reps: "12-15", rest: 60, completedSets: 0 }
      ],
      pull: [
        { id: "r1", name: "Remo inclinado", target: "Espalda dorsal", desc: "Pisa el centro de la banda larga, torso a 45°. Pausa de 1s con codos atrás.", sets: 4, reps: "10-12", rest: 75, completedSets: 0 },
        { id: "r2", name: "Band Pull-Aparts", target: "Hombro posterior", desc: "Banda a la altura del pecho; separa brazos juntando escápulas.", sets: 3, reps: "15-20", rest: 60, completedSets: 0 },
        { id: "r3", name: "Curl de bíceps", target: "Bíceps", desc: "Pisa la banda larga con ambos pies. Baja en 3s sin despegar codos del costado.", sets: 3, reps: "10-12", rest: 60, completedSets: 0 },
        { id: "r4", name: "Face Pull (media altura)", target: "Espalda alta y cuello", desc: "Ancla la banda a un pomo cerrado. Tira hacia la cara abriendo manos.", sets: 3, reps: "12-15", rest: 60, completedSets: 0 }
      ]
    };

    let activeRoutine = "push";
    let timerInterval = null;
    let secondsLeft = 0;

    function renderExercises() {
      const container = document.getElementById("exercises-container");
      container.innerHTML = "";

      routines[activeRoutine].forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "exercise-card";
        card.innerHTML = `
          <div class="exercise-header">
            <span class="exercise-title">${item.name}</span>
            <span class="exercise-target">${item.target}</span>
          </div>
          <div class="exercise-desc">${item.desc}</div>
          <div class="config-grid">
            <div class="config-item">
              <label>Series</label>
              <input type="number" value="${item.sets}" min="1" onchange="updateParam('${item.id}', 'sets', this.value)" />
            </div>
            <div class="config-item">
              <label>Reps</label>
              <input type="text" value="${item.reps}" onchange="updateParam('${item.id}', 'reps', this.value)" />
            </div>
            <div class="config-item">
              <label>Descanso (s)</label>
              <input type="number" value="${item.rest}" min="5" step="5" onchange="updateParam('${item.id}', 'rest', this.value)" />
            </div>
          </div>
          <div class="series-tracker">
            <span class="sets-counter" id="counter-${item.id}">Completadas: ${item.completedSets} / ${item.sets}</span>
            <div>
              <button class="btn-action btn-complete" onclick="markSet('${item.id}')">Hecha</button>
              <button class="btn-action btn-reset" onclick="resetSets('${item.id}')">↻</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchRoutine(type) {
      activeRoutine = type;
      document.querySelectorAll(".tab-btn").forEach((btn, i) => {
        btn.classList.toggle("active", (i === 0 && type === "push") || (i === 1 && type === "pull"));
      });
      renderExercises();
    }

    function updateParam(id, field, value) {
      const ex = routines[activeRoutine].find(e => e.id === id);
      if (ex) {
        ex[field] = field === "reps" ? value : parseInt(value) || 0;
        document.getElementById(`counter-${id}`).innerText = `Completadas: ${ex.completedSets} / ${ex.sets}`;
      }
    }

    function markSet(id) {
      const ex = routines[activeRoutine].find(e => e.id === id);
      if (ex && ex.completedSets < ex.sets) {
        ex.completedSets++;
        document.getElementById(`counter-${id}`).innerText = `Completadas: ${ex.completedSets} / ${ex.sets}`;
        startTimer(ex.rest);
      }
    }

    function resetSets(id) {
      const ex = routines[activeRoutine].find(e => e.id === id);
      if (ex) {
        ex.completedSets = 0;
        document.getElementById(`counter-${id}`).innerText = `Completadas: 0 / ${ex.sets}`;
      }
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      secondsLeft = parseInt(seconds);
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        secondsLeft--;
        updateTimerDisplay();
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
        }
      }, 1000);
    }

    function addSeconds(sec) {
      secondsLeft += sec;
      updateTimerDisplay();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      secondsLeft = 0;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const m = Math.floor(Math.max(0, secondsLeft) / 60).toString().padStart(2, "0");
      const s = (Math.max(0, secondsLeft) % 60).toString().padStart(2, "0");
      document.getElementById("timer-display").innerText = `${m}:${s}`;
    }

    renderExercises();
  </script>
</body>
</html>
