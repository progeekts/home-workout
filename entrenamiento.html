<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenamiento con Bandas Elásticas (A - N)</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #10b981;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 60px; }
    header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 24px 20px; text-align: center; }
    header h1 { font-size: 1.8rem; margin-bottom: 6px; }

    .container { max-width: 960px; margin: 0 auto; padding: 20px 16px; }

    /* Barra de carga de imágenes */
    .upload-bar {
      background: #eff6ff;
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .upload-inputs {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .upload-btn-label {
      background: white;
      border: 1px solid #bfdbfe;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--primary);
    }
    .upload-btn-label:hover { background: #f0fdf4; }
    input[type="file"] { display: none; }

    /* Botones de acción */
    .view-toggle { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center; flex-wrap: wrap; }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: white; color: var(--text); border: 1px solid var(--border); }
    .btn-accent { background: var(--accent); color: white; }

    /* Ventana de entrenamiento activo */
    #workout-panel {
      display: none;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      border: 1px solid var(--border);
      text-align: center;
    }

    .crop-viewport {
      width: 100%;
      height: 200px;
      background-color: #f1f5f9;
      background-repeat: no-repeat;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .workout-viewport {
      max-width: 480px;
      height: 260px;
      margin: 15px auto;
    }

    .timer-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid #e0e7ff;
      border-top-color: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 15px auto;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
    }
    .timer-circle .label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    .badge-letter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      background-color: #dbeafe;
      color: var(--primary);
      font-weight: 800;
      font-size: 1.1rem;
      border-radius: 6px;
      margin-right: 8px;
    }

    /* Catálogo de ejercicios */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: space-between; }
    .card-muscle { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 3px 8px; background-color: #f1f5f9; color: var(--muted); border-radius: 4px; margin: 8px 0; }
    .card-desc { font-size: 0.9rem; color: #475569; margin-bottom: 10px; }
    .card-cue { font-size: 0.82rem; background-color: #f8fafc; padding: 8px; border-left: 3px solid var(--primary); border-radius: 0 6px 6px 0; }
  </style>
</head>
<body>

  <header>
    <h1>Rutina Ilustrada con Bandas Elásticas</h1>
    <p>Ejercicios A a N interactivos</p>
  </header>

  <div class="container">
    
    <!-- Zona de carga de fotos -->
    <div class="upload-bar">
      <strong>Paso obligatorio inicial:</strong> Carga las fotos desde tu dispositivo para habilitar las ilustraciones.
      <div class="upload-inputs">
        <label class="upload-btn-label" id="label-h1">
          📁 Subir Foto 1 (A-J)
          <input type="file" accept="image/*" onchange="loadFile(event, 1)">
        </label>
        <label class="upload-btn-label" id="label-h2">
          📁 Subir Foto 2 (K-N)
          <input type="file" accept="image/*" onchange="loadFile(event, 2)">
        </label>
      </div>
    </div>

    <div class="view-toggle">
      <button class="btn btn-accent" onclick="startRoutine('all')">▶ Entrenar Rutina Completa</button>
      <button class="btn btn-secondary" onclick="startRoutine('upper')">Tren Superior</button>
      <button class="btn btn-secondary" onclick="startRoutine('lower')">Tren Inferior & Core</button>
    </div>

    <!-- Pantalla de Temporizador -->
    <div id="workout-panel">
      <span class="card-muscle" id="workout-phase">EN EJECUCIÓN</span>
      <h2 id="current-title" style="margin-top: 6px;"></h2>
      
      <div class="crop-viewport workout-viewport" id="workout-img-box">Sin imagen</div>

      <p id="current-desc" style="color: var(--muted); margin: 6px auto 14px; max-width: 600px; font-size: 0.95rem;"></p>

      <div class="timer-circle" id="timer-box">
        <span id="timer-num">40</span>
        <span class="label">Segundos</span>
      </div>

      <div style="margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
        <button class="btn btn-secondary" onclick="prevExercise()">⏮ Anterior</button>
        <button class="btn btn-primary" id="pause-btn" onclick="togglePause()">Pausar</button>
        <button class="btn btn-secondary" onclick="nextExercise()">Siguiente ⏭</button>
        <button class="btn" style="background:#ef4444; color:white;" onclick="stopRoutine()">Terminar</button>
      </div>
      <p style="margin-top: 14px; font-size: 0.85rem; color: var(--muted);" id="progress-indicator"></p>
    </div>

    <div class="grid" id="exercise-grid"></div>
  </div>

  <script>
    const exercises = [
      { id: "A", sheet: 1, name: "Remo al mentón", group: "superior", muscle: "Deltoides y Trapecio", desc: "Pisa la banda y sube los codos hacia afuera hasta el pecho.", cue: "Guía el movimiento tirando de los codos.", x: 20, y: 22, zoom: 420 },
      { id: "B", sheet: 1, name: "Curl de bíceps", group: "superior", muscle: "Bíceps braquial", desc: "Pisa la goma; codos pegados al cuerpo, flexiona antebrazos.", cue: "No balancees el torso al subir.", x: 42, y: 22, zoom: 440 },
      { id: "C", sheet: 1, name: "Elevación frontal / Tirón al pecho", group: "superior", muscle: "Hombro anterior", desc: "Pisa la banda y eleva hacia el frente.", cue: "Abdomen firme para no arquear la espalda.", x: 20, y: 50, zoom: 430 },
      { id: "D", sheet: 1, name: "Aperturas de pecho", group: "superior", muscle: "Pectorales y romboides", desc: "Brazos al frente a nivel del pecho; abre en cruz.", cue: "Junta las escápulas al final.", x: 42, y: 50, zoom: 440 },
      { id: "E", sheet: 1, name: "Apertura tras nuca", group: "superior", muscle: "Espalda alta y deltoides", desc: "Goma tras la nuca; abre los brazos lateralmente.", cue: "Cuello relajado y hombros abajo.", x: 20, y: 78, zoom: 420 },
      { id: "F", sheet: 1, name: "Tirón diagonal (Espadachín)", group: "superior", muscle: "Hombros y tríceps", desc: "Un brazo ancla y el otro estira en diagonal arriba.", cue: "Retorno suave y controlado.", x: 42, y: 78, zoom: 440 },
      { id: "G", sheet: 1, name: "Elevaciones laterales en cruz", group: "superior", muscle: "Deltoides lateral", desc: "Pisa la goma cruzada y abre los brazos a los costados.", cue: "Sube hasta la altura de los hombros.", x: 80, y: 19, zoom: 270 },
      { id: "H", sheet: 1, name: "Prensa de piernas tumbado", group: "inferior", muscle: "Cuádriceps y glúteos", desc: "Boca arriba; empuja la banda con la suela del pie.", cue: "Mantén la zona lumbar en la colchoneta.", x: 80, y: 39, zoom: 270 },
      { id: "I", sheet: 1, name: "Remo sentado", group: "superior", muscle: "Dorsal y espalda media", desc: "Pasa la goma en los pies y tracciona llevando codos atrás.", cue: "Abre el pecho al traccionar.", x: 80, y: 59, zoom: 270 },
      { id: "J", sheet: 1, name: "Patada de glúteo (cuadrupedia)", group: "inferior", muscle: "Glúteo mayor", desc: "A 4 patas; empuja con la planta del pie estirando atrás.", cue: "Aprieta el glúteo sin forzar la espalda.", x: 80, y: 81, zoom: 270 },
      { id: "K", sheet: 2, name: "Rotadores externos de hombro", group: "superior", muscle: "Manguito rotador", desc: "Codos a 90° pegados; abre las manos hacia afuera.", cue: "Mantén los codos pegados a las costillas.", x: 50, y: 14, zoom: 190 },
      { id: "L", sheet: 2, name: "Extensión tríceps tras nuca", group: "superior", muscle: "Tríceps braquial", desc: "Mano sujeta abajo y la otra estira al techo.", cue: "El codo que sube debe apuntar arriba.", x: 50, y: 38, zoom: 190 },
      { id: "M", sheet: 2, name: "Patada vertical a 90°", group: "inferior", muscle: "Glúteo", desc: "Apoyo en antebrazos; empuja la planta hacia el techo.", cue: "Suela paralela al techo.", x: 50, y: 62, zoom: 190 },
      { id: "N", sheet: 2, name: "Abducción lateral de cadera", group: "inferior", muscle: "Glúteo medio", desc: "Tumbado de lado con banda en tobillos; eleva la pierna.", cue: "Pelvis fija, sin rotar hacia atrás.", x: 50, y: 86, zoom: 190 }
    ];

    const sheets = { 1: null, 2: null };

    function loadFile(event, sheetNum) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        sheets[sheetNum] = e.target.result;
        document.getElementById(`label-h${sheetNum}`).style.background = "#dcfce7";
        document.getElementById(`label-h${sheetNum}`).style.color = "#15803d";
        document.getElementById(`label-h${sheetNum}`).innerHTML = `✓ Foto ${sheetNum} cargada`;
        applyImages();
      };
      reader.readAsDataURL(file);
    }

    function applyCropStyle(element, item) {
      const imgData = sheets[item.sheet];
      if (!imgData) {
        element.style.backgroundImage = 'none';
        element.innerText = `Sube Foto ${item.sheet}`;
        return;
      }
      element.innerText = '';
      element.style.backgroundImage = `url("${imgData}")`;
      element.style.backgroundPosition = `${item.x}% ${item.y}%`;
      element.style.backgroundSize = `${item.zoom}%`;
    }

    function applyImages() {
      exercises.forEach(item => {
        const box = document.getElementById(`box-${item.id}`);
        if (box) applyCropStyle(box, item);
      });
      if (document.getElementById('workout-panel').style.display === 'block') {
        const current = activeQueue[currentIndex];
        applyCropStyle(document.getElementById('workout-img-box'), current);
      }
    }

    function renderCards(list) {
      const grid = document.getElementById('exercise-grid');
      grid.innerHTML = "";
      list.forEach(item => {
        const card = document.createElement('div');
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="crop-viewport" id="box-${item.id}">Sube Foto ${item.sheet}</div>
            <div style="display:flex; align-items:center; margin: 10px 0 4px;">
              <span class="badge-letter">${item.id}</span>
              <h4 style="font-size:1.05rem;">${item.name}</h4>
            </div>
            <span class="card-muscle">${item.muscle}</span>
            <p class="card-desc">${item.desc}</p>
          </div>
          <div class="card-cue"><strong>Consejo:</strong> ${item.cue}</div>
        `;
        grid.appendChild(card);
        applyCropStyle(card.querySelector(`#box-${item.id}`), item);
      });
    }

    /* Rutina interactiva */
    let activeQueue = [];
    let currentIndex = 0;
    let timeLeft = 40;
    let isPaused = false;
    let isRest = false;
    let timerInterval = null;

    function startRoutine(mode) {
      if (mode === 'all') activeQueue = [...exercises];
      else if (mode === 'upper') activeQueue = exercises.filter(e => e.group === 'superior');
      else if (mode === 'lower') activeQueue = exercises.filter(e => e.group === 'inferior');

      currentIndex = 0;
      isRest = false;
      isPaused = false;
      document.getElementById('workout-panel').style.display = 'block';
      window.scrollTo({ top: 180, behavior: 'smooth' });
      loadExercise();
    }

    function loadExercise() {
      clearInterval(timerInterval);
      const current = activeQueue[currentIndex];
      const cropBox = document.getElementById('workout-img-box');

      if (!isRest) {
        timeLeft = 40;
        document.getElementById('workout-phase').innerText = "EN EJECUCIÓN";
        document.getElementById('workout-phase').style.background = "#dcfce7";
        document.getElementById('workout-phase').style.color = "#15803d";
        document.getElementById('current-title').innerHTML = `<span class="badge-letter">${current.id}</span> ${current.name}`;
        document.getElementById('current-desc').innerText = `${current.desc} — ${current.cue}`;
        applyCropStyle(cropBox, current);
      } else {
        timeLeft = 20;
        document.getElementById('workout-phase').innerText = "DESCANSO";
        document.getElementById('workout-phase').style.background = "#fee2e2";
        document.getElementById('workout-phase').style.color = "#b91c1c";
        document.getElementById('current-title').innerText = "¡Descansa!";
        document.getElementById('current-desc').innerText = `Siguiente: (${current.id}) ${current.name}`;
      }

      document.getElementById('progress-indicator').innerText = `Ejercicio ${currentIndex + 1} de ${activeQueue.length}`;
      document.getElementById('timer-num').innerText = timeLeft;
      runTimer();
    }

    function runTimer() {
      timerInterval = setInterval(() => {
        if (!isPaused) {
          timeLeft--;
          document.getElementById('timer-num').innerText = timeLeft;
          if (timeLeft === 0) {
            clearInterval(timerInterval);
            if (!isRest) {
              if (currentIndex < activeQueue.length - 1) {
                isRest = true;
                currentIndex++;
                loadExercise();
              } else {
                alert("¡Entrenamiento terminado!");
                stopRoutine();
              }
            } else {
              isRest = false;
              loadExercise();
            }
          }
        }
      }, 1000);
    }

    function togglePause() {
      isPaused = !isPaused;
      document.getElementById('pause-btn').innerText = isPaused ? "Reanudar" : "Pausar";
    }
    function nextExercise() {
      if (currentIndex < activeQueue.length - 1) { currentIndex++; isRest = false; loadExercise(); }
    }
    function prevExercise() {
      if (currentIndex > 0) { currentIndex--; isRest = false; loadExercise(); }
    }
    function stopRoutine() {
      clearInterval(timerInterval);
      document.getElementById('workout-panel').style.display = 'none';
    }

    renderCards(exercises);
  </script>
</body>
</html>
